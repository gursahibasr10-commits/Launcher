name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone application
        run: pyinstaller --noconfirm --clean --windowed --onefile --name Launcher main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" Launcher.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-Windows-Installer
          path: artifacts/Launcher-Setup.exe
          if-no-files-found: error
          retention-days: 30
